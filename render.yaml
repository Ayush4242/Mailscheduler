services:
  # 1. Express API Web Service
  - type: web
    name: reachinbox-api
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: reachinbox-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: reachinbox-redis
          property: port

  # 2. BullMQ Background Worker Service
  - type: worker
    name: reachinbox-worker
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/workers/email.worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: reachinbox-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: reachinbox-redis
          property: port

  # 3. Managed Redis Service
  - type: redis
    name: reachinbox-redis
    ipAllowList: []
    plan: free

databases:
  # Managed PostgreSQL Database
  - name: reachinbox-db
    databaseName: reachinbox
    user: reachinbox_user
    plan: free
